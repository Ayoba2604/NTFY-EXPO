<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="180" fill="#38BDF8" opacity="0.08"/>
  <circle cx="620" cy="460" r="200" fill="#2563EB" opacity="0.15"/>

  <!-- Ícone de check -->
  <rect x="70" y="70" width="64" height="64" rx="16" fill="url(#accent)"/>
  <path d="M90 103 l11 11 l22 -24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Textos -->
  <text x="70" y="195" font-size="56" font-weight="700" fill="#FFFFFF">To-Do List App</text>
  <text x="70" y="238" font-size="24" fill="#BFDBFE">Gerencie tarefas e receba alertas em tempo real</text>
  <rect x="70" y="256" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Tags de tecnologia -->
  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="70"  y="300" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#93C5FD" stroke-opacity="0.5"/>
    <text x="145" y="326" fill="#E0F2FE">React Native</text>
    <rect x="232" y="300" width="130" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#93C5FD" stroke-opacity="0.5"/>
    <text x="297" y="326" fill="#E0F2FE">Expo Go</text>
    <rect x="374" y="300" width="130" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#93C5FD" stroke-opacity="0.5"/>
    <text x="439" y="326" fill="#E0F2FE">Supabase</text>
    <rect x="516" y="300" width="110" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#93C5FD" stroke-opacity="0.5"/>
    <text x="571" y="326" fill="#E0F2FE">NTFY</text>
  </g>

  <!-- Celular -->
  <g transform="translate(40,0)"><g filter="url(#shadow)">
    <rect x="860" y="40" width="240" height="470" rx="36" fill="#0B1220" stroke="#334155" stroke-width="4"/>
    <rect x="876" y="60" width="208" height="430" rx="26" fill="#F3F4F6"/>
    <rect x="945" y="68" width="70" height="8" rx="4" fill="#0B1220"/>

    <text x="980" y="108" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Minhas Tarefas</text>

    <!-- Campos do formulário -->
    <rect x="892" y="122" width="176" height="22" rx="6" fill="#fff" stroke="#D1D5DB"/>
    <rect x="900" y="130" width="70" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="892" y="152" width="176" height="22" rx="6" fill="#fff" stroke="#D1D5DB"/>
    <rect x="900" y="160" width="100" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="892" y="182" width="176" height="30" rx="8" fill="#2563EB"/>
    <text x="980" y="202" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Cadastrar tarefa</text>

    <!-- Cards -->
    <rect x="892" y="228" width="176" height="52" rx="8" fill="#fff"/>
    <rect x="892" y="228" width="4" height="52" rx="2" fill="#2563EB"/>
    <rect x="906" y="238" width="90" height="8" rx="4" fill="#1F2937"/>
    <rect x="906" y="252" width="130" height="6" rx="3" fill="#CBD5E1"/>
    <text x="906" y="272" font-size="10" font-weight="700" fill="#2563EB">Término: 30/10/2026</text>

    <rect x="892" y="288" width="176" height="52" rx="8" fill="#fff"/>
    <rect x="892" y="288" width="4" height="52" rx="2" fill="#2563EB"/>
    <rect x="906" y="298" width="70" height="8" rx="4" fill="#1F2937"/>
    <rect x="906" y="312" width="110" height="6" rx="3" fill="#CBD5E1"/>
    <text x="906" y="332" font-size="10" font-weight="700" fill="#2563EB">Término: 05/11/2026</text>

    <rect x="892" y="348" width="176" height="52" rx="8" fill="#fff"/>
    <rect x="892" y="348" width="4" height="52" rx="2" fill="#2563EB"/>
    <rect x="906" y="358" width="100" height="8" rx="4" fill="#1F2937"/>
    <rect x="906" y="372" width="120" height="6" rx="3" fill="#CBD5E1"/>
    <text x="906" y="392" font-size="10" font-weight="700" fill="#2563EB">Término: 12/11/2026</text>
  </g>

  </g>
  <!-- Notificação -->
  <g transform="translate(-70,50)"><g filter="url(#shadow)">
    <rect x="690" y="60" width="290" height="76" rx="16" fill="#FFFFFF"/>
    <rect x="706" y="78" width="40" height="40" rx="10" fill="url(#accent)"/>
    <path d="M718 99 l7 7 l14 -15" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="758" y="94" font-size="15" font-weight="700" fill="#111827">Nova tarefa cadastrada</text>
    <text x="758" y="116" font-size="13" fill="#4B5563">Data de término: 30/10/2026</text>
  </g></g>
</svg>
